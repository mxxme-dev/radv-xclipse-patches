name: Build RADV Xclipse for Termux (LLVM 21)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo sed -i 's/Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            clang \
            llvm-dev \
            pkg-config \
            python3-mako \
            python3-pip \
            flex \
            bison \
            glslang-tools \
            libxfixes-dev \
            libxdamage-dev
          # Install LLVM 21 using official script
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          # Set LLVM 21 as default where possible
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-21 200 || true
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 200 || true
          sudo apt-get build-dep -y mesa

      - name: Prepare prefix and build
        run: |
          export PREFIX=/tmp/radv-install
          rm -rf build
          meson setup build \
            --prefix=$PREFIX \
            -Dplatforms=x11 \
            -Dvulkan-drivers=amd \
            -Dgallium-drivers=zink \
            -Dbuildtype=release
          cd build
          ninja install

      - name: Package artifact
        run: |
          tar -czf radv-xclipse-aarch64-llvm21.tar.gz -C /tmp/radv-install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radv-xclipse-aarch64-llvm21
          path: radv-xclipse-aarch64-llvm21.tar.gz
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: radv-xclipse-aarch64-llvm21.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
