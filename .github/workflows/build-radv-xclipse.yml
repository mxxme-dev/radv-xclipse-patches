name: Build RADV Xclipse for Termux

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            clang \
            llvm-dev \
            pkg-config \
            python3-mako \
            python3-pip \
            libdrm-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxcb-dri3-dev \
            libxshmfence-dev

      - name: Prepare prefix and build
        run: |
          export PREFIX=/tmp/radv-install
          rm -rf build
          meson setup build \
            --prefix=$PREFIX \
            -Dplatforms=x11 \
            -Dvulkan-drivers=amd \
            -Dgallium-drivers=zink \
            -Dbuildtype=release
          cd build
          ninja install

      - name: Package artifact
        run: |
          tar -czf radv-xclipse-aarch64.tar.gz -C /tmp/radv-install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radv-xclipse-aarch64
          path: radv-xclipse-aarch64.tar.gz
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: radv-xclipse-aarch64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
